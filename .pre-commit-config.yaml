repos:
  - repo: local
    hooks:
      - id: venv-check
        name: venv-check
        entry: bash -lc "make -s venv.check"
        language: system
        pass_filenames: false
      - id: ssot-guards
        name: ssot-guards
        entry: bash -lc "make -s ssot.env.check rules.check scripts.unique"
        language: system
        pass_filenames: false
      - id: rules-emit-compat
        name: rules-emit (compat)
        entry: bash -lc "make -s rules-emit"
        language: system
        pass_filenames: false