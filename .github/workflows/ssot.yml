name: SSOT & Venv Guards
on:
  push:
  pull_request:
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap venv
        run: make -s venv.ensure
      - name: Emit rules
        run: make -s rules.emit
      - name: Run guard suite
        run: make -s ssot.guards


